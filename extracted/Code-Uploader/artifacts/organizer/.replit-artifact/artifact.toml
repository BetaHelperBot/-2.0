kind = "mobile"
previewPath = "/"
title = "Личный Органайзер"
version = "1.0.0"
id = "artifacts/organizer"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/" ]
localPort = 25019

[services.development]
run = "pnpm --filter @workspace/organizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/organizer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/organizer", "run", "serve" ]

[services.env]
PORT = "25019"
BASE_PATH = "/"
